<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{layout/base :: shell(${pageTitle}, ~{::content})}">
    <th:block th:fragment="content">
        <section class="panel admin-data-page client-admin-page">
            <div class="dashboard-head">
                <div>
                    <h2 class="h3 mb-2">거래처 조회</h2>
                    <p class="summary mb-0">거래처를 조회하고 등록하며 관리합니다.</p>
                </div>
                <div class="dashboard-actions">
                    <a th:href="@{/clients/new}" class="secondary-link">등록</a>
                    <a th:href="@{/research}" class="secondary-link">좌담회/설문</a>
                </div>
            </div>

            <div th:if="${param.deleted}" class="notice success">거래처를 삭제했습니다. 기존 공고에 저장된 거래처 정보는 유지됩니다.</div>

            <form th:action="@{/clients}" method="get" class="admin-data-search client-search-grid">
                <label>
                    <span>상태</span>
                    <select name="active">
                        <option value="ALL" th:selected="${active == null or active == 'ALL'}">전체</option>
                        <option value="Y" th:selected="${active == 'Y'}">사용</option>
                        <option value="N" th:selected="${active == 'N'}">미사용</option>
                    </select>
                </label>
                <label class="client-search-grid__wide">
                    <span>통합 검색</span>
                    <input type="text" name="keyword" th:value="${keyword}" placeholder="거래처명, 담당자, 이메일, 연락처">
                </label>
                <div class="client-search-actions">
                    <button type="submit">조회</button>
                    <a th:href="@{/clients}" class="secondary-link">초기화</a>
                </div>
            </form>

            <p class="admin-data-count">[ <strong th:text="${totalItemCount}">0</strong> 건 조회됨 ]</p>

            <div class="applicant-table-wrap client-table-wrap">
                <table class="table admin-data-table client-data-table">
                    <colgroup>
                        <col class="client-col-no">
                        <col class="client-col-name">
                        <col class="client-col-department">
                        <col class="client-col-contact">
                        <col class="client-col-phone">
                        <col class="client-col-email">
                        <col class="client-col-status">
                        <col class="client-col-actions">
                    </colgroup>
                    <thead>
                    <tr>
                        <th>No</th>
                        <th>거래처명</th>
                        <th>부서</th>
                        <th>대표 담당자</th>
                        <th>담당자 연락처</th>
                        <th>대표 이메일</th>
                        <th>상태</th>
                        <th>관리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(clients)}">
                        <td colspan="8" class="text-center text-muted py-4">현재 조건에 맞는 거래처가 없습니다.</td>
                    </tr>
                    <tr th:each="client, iter : ${clients}">
                        <td class="text-center" th:text="${iter.index + 1}">1</td>
                        <td class="client-name-cell" th:text="${client.clientName()}">거래처명</td>
                        <td th:text="${client.departmentName() != null ? client.departmentName() : '-'}">-</td>
                        <td th:text="${client.primaryContactName() != null ? client.primaryContactName() : '-'}">-</td>
                        <td th:text="${client.primaryContactNo() != null ? client.primaryContactNo() : '-'}">-</td>
                        <td th:text="${client.primaryEmail() != null ? client.primaryEmail() : '-'}">-</td>
                        <td class="text-center">
                            <span class="client-status-badge"
                                  th:classappend="${client.active()} ? ' client-status-badge--active' : ' client-status-badge--inactive'"
                                  th:text="${client.active()} ? '사용' : '미사용'">사용</span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/clients/{clientId}/edit(clientId=${client.id()})}" class="secondary-link">수정</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </th:block>
</th:block>
</html>
