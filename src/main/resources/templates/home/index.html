<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{layout/base :: shell(${pageTitle}, ~{::content})}">
    <th:block th:fragment="content">
        <section class="panel">
            <div class="grid">
                <article class="metric">
                    <strong>스프링 부트</strong>
                    <span>애플리케이션 진입점과 기본 웹 실행 구성을 준비했습니다.</span>
                </article>
                <article class="metric">
                    <strong>타임리프</strong>
                    <span>공통 레이아웃과 첫 화면 템플릿 구조를 추가했습니다.</span>
                </article>
                <article class="metric">
                    <strong>마이바티스</strong>
                    <span>향후 모듈별 매퍼를 연결할 수 있도록 세션 팩토리 구성을 분리했습니다.</span>
                </article>
                <article class="metric">
                    <strong>이중 데이터소스</strong>
                    <span>`xeDataSource`와 `adminDataSource`를 각각 독립적으로 구성했습니다.</span>
                </article>
            </div>
            <div class="note">
                현재 화면은 프로젝트 초기 진입용 요약입니다. 운영 기능은 대시보드와 각 관리자 화면에서 확인할 수 있습니다.
            </div>
        </section>
    </th:block>
</th:block>
</html>
