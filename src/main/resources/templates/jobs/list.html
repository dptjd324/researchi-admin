<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{layout/base :: shell(${pageTitle}, ~{::content})}">
    <th:block th:fragment="content">
        <section class="panel">
            <div class="dashboard-head">
                <div>
                    <h2 class="h3 mb-2">공고 목록</h2>
                    <p class="dashboard-copy mb-0">신규 일감과 추가 일감을 조회하고, 상태와 운영 메타 정보를 빠르게 관리합니다.</p>
                </div>
                <div class="dashboard-actions">
                    <a th:href="@{/jobs/new}" class="secondary-link">공고 등록</a>
                </div>
            </div>

            <div th:if="${param.statusUpdated}" class="notice success">공고 상태를 변경했습니다.</div>

            <div class="list-toolbar">
                <form method="get" th:action="@{/jobs}" class="search-form">
                    <input type="hidden" name="jobType" th:value="${selectedJobType}">
                    <input type="text" name="keyword" th:value="${keyword}" placeholder="공고 제목 검색">
                    <button type="submit">검색</button>
                    <a th:href="${selectedJobType != null ? '/jobs?jobType=' + selectedJobType : '/jobs'}" class="secondary-link">초기화</a>
                </form>
            </div>

            <div class="filter-row">
                <a th:href="@{/jobs(keyword=${keyword})}" th:classappend="${selectedJobType == null ? 'active-filter' : ''}" class="filter-link">전체</a>
                <a th:each="jobType : ${jobTypes}"
                   th:href="@{/jobs(jobType=${jobType.name()}, keyword=${keyword})}"
                   th:text="${jobType.label}"
                   th:classappend="${selectedJobType == jobType.name() ? 'active-filter' : ''}"
                   class="filter-link">신규 일감</a>
            </div>

            <div class="job-list" th:if="${!#lists.isEmpty(jobs)}">
                <article class="job-item" th:each="job : ${jobs}">
                    <div class="job-item-head">
                        <div>
                            <p class="eyebrow" th:text="${@uiLabels.jobBoard(job.mid)}">신규 공고</p>
                            <h3 class="h5 mb-2">
                                <a th:href="@{/jobs/{documentSrl}(documentSrl=${job.documentSrl})}" th:text="${job.title}" class="job-title-link">공고 제목</a>
                            </h3>
                        </div>
                        <div class="actions">
                            <a th:if="${job.applicationBoard}" th:href="@{/jobs/{documentSrl}/applications(documentSrl=${job.documentSrl})}" class="secondary-link">지원서</a>
                            <a th:if="${job.applicationBoard}" th:href="@{/matching/jobs/{documentSrl}(documentSrl=${job.documentSrl})}" class="secondary-link">매칭</a>
                            <a th:if="${job.applicationBoard}" th:href="@{/mail/send/history(documentSrl=${job.documentSrl})}" class="secondary-link">메일</a>
                            <a th:href="@{/jobs/{documentSrl}/edit(documentSrl=${job.documentSrl})}" class="secondary-link">수정</a>
                        </div>
                    </div>
                    <p class="job-summary" th:text="${#strings.abbreviate(job.content, 160)}">공고 요약</p>
                    <div class="job-meta-grid">
                        <span><strong>문서번호</strong><span th:text="${job.documentSrl}">1</span></span>
                        <span><strong>게시판</strong><span th:text="${@uiLabels.jobBoard(job.mid)}">신규 공고</span></span>
                        <span><strong>신청 관리</strong><span th:text="${job.applicationBoard ? '지원' : '미지원'}">지원</span></span>
                        <span><strong>모집 상태</strong><span th:text="${@uiLabels.recruitStatus(job.meta != null ? job.meta.recruitStatus : 'WAITING')}">대기</span></span>
                        <span><strong>거래처</strong><span th:text="${job.meta != null ? job.meta.clientName : '-'}">-</span></span>
                    </div>
                    <form th:attr="action=${'/jobs/' + job.documentSrl + '/status'}" method="post" class="inline-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <select name="recruitStatus">
                            <option value="RECRUITING" th:selected="${job.meta != null ? job.meta.recruitStatus == 'RECRUITING' : job.xeStatus == 'PUBLIC'}">모집중</option>
                            <option value="WAITING" th:selected="${job.meta != null ? job.meta.recruitStatus == 'WAITING' : job.xeStatus == 'TEMP'}">대기</option>
                            <option value="CLOSED" th:selected="${job.meta != null ? job.meta.recruitStatus == 'CLOSED' : job.xeStatus == 'CLOSED'}">마감</option>
                        </select>
                        <button type="submit">상태 변경</button>
                    </form>
                </article>
            </div>

            <div th:if="${#lists.isEmpty(jobs)}" class="note">
                현재 조건에 맞는 공고가 없습니다.
            </div>
            <div class="pagination-bar" th:if="${paginationEnabled}">
                <a th:if="${previousPageUrl != null}" th:href="${previousPageUrl}" class="pagination-bar__nav" aria-label="이전 페이지">‹</a>
                <span th:if="${previousPageUrl == null}" class="pagination-bar__nav pagination-bar__nav--disabled" aria-hidden="true">‹</span>
                <a th:each="pageLink : ${pageLinks}"
                   th:href="${pageLink.url}"
                   th:text="${pageLink.pageNumber}"
                   th:classappend="${pageLink.current ? ' pagination-bar__page--active' : ''}"
                   class="pagination-bar__page">1</a>
                <a th:if="${nextPageUrl != null}" th:href="${nextPageUrl}" class="pagination-bar__nav" aria-label="다음 페이지">›</a>
                <span th:if="${nextPageUrl == null}" class="pagination-bar__nav pagination-bar__nav--disabled" aria-hidden="true">›</span>
            </div>
        </section>
    </th:block>
</th:block>
</html>
