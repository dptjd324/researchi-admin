<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="shell(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Researchi Admin</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/themes/material_green.css">
    <link rel="stylesheet" th:href="@{/css/admin-ui.css}">
</head>
<body class="admin-body">
<div class="admin-shell">
    <header class="admin-header border-bottom" th:if="${hideNavigation == null || !hideNavigation}">
        <div class="container-fluid admin-container">
            <nav class="admin-navbar" aria-label="관리자 상단 메뉴">
                <div class="admin-header__top">
                    <div class="admin-header__hero" th:if="${hidePageHeader == null || !hidePageHeader}">
                        <div class="admin-header__title">
                            <div class="admin-header__eyebrow">RESEARCHI 운영 관리</div>
                            <h1 class="admin-page-title h4 mb-1" th:text="${title}">Researchi Admin</h1>
                            <p class="admin-page-description mb-0" th:text="${pageDescription}">공고, 지원서, 메일, 로그, 기간 검색을 한 화면 안에서 관리합니다.</p>
                        </div>
                    </div>
                    <div class="admin-account-actions">
                        <a class="admin-account-actions__link" th:href="@{/account/password}">비밀번호 변경</a>
                        <form action="/logout" method="post" class="admin-account-actions__form">
                            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="admin-account-actions__logout">로그아웃</button>
                        </form>
                    </div>
                </div>
                <ul class="navbar-nav mb-0 admin-nav-list">
                    <li class="nav-item"><a class="nav-link" th:href="@{/jobs}">공고</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/research}">좌담회/설문</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/clients}">거래처</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/applications}">지원서</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/legacy-blacklist}">블랙리스트</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/search}">통합 검색</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/mail/send/history}">메일</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/logs/actions}">로그</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container-fluid admin-container py-4 py-lg-5" th:classappend="${contentContainerClass != null ? ' ' + contentContainerClass : ''}">
        <main th:replace="${content}">
            <div>content</div>
        </main>
    </div>

    <aside class="admin-status-dock border-top" th:if="${statusBarSummary != null and (hideStatusDock == null || !hideStatusDock)}">
        <div class="container-fluid admin-container py-3">
            <div class="admin-status-row">
                <div class="admin-status-card">
                    <span class="admin-status-card__label">액션 로그</span>
                    <strong th:text="${statusBarSummary.actionCount + '건'}">0건</strong>
                    <span th:text="${statusBarSummary.latestActionAt != null ? @uiLabels.dateTime(statusBarSummary.latestActionAt) : '기록 없음'}">기록 없음</span>
                </div>
                <div class="admin-status-card">
                    <span class="admin-status-card__label">메일 로그</span>
                    <strong th:text="${statusBarSummary.mailCount + '건'}">0건</strong>
                    <span th:text="${statusBarSummary.latestMailAt != null ? @uiLabels.dateTime(statusBarSummary.latestMailAt) : '기록 없음'}">기록 없음</span>
                </div>
                <div class="admin-status-card">
                    <span class="admin-status-card__label">검색 로그</span>
                    <strong th:text="${statusBarSummary.searchCount + '건'}">0건</strong>
                    <span th:text="${statusBarSummary.latestSearchAt != null ? @uiLabels.dateTime(statusBarSummary.latestSearchAt) : '기록 없음'}">기록 없음</span>
                </div>
                <div class="admin-status-card">
                    <span class="admin-status-card__label">알림 로그</span>
                    <strong th:text="${statusBarSummary.notificationCount + '건'}">0건</strong>
                    <span th:text="${statusBarSummary.latestNotificationAt != null ? @uiLabels.dateTime(statusBarSummary.latestNotificationAt) : '기록 없음'}">기록 없음</span>
                </div>
            </div>
        </div>
    </aside>
</div>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/ko.js"></script>
<script>
    (function initializeFlatpickrInputs() {
        function createOptions(input) {
            const isDateTime = input.type === 'datetime-local';
            const isCompactDate = input.classList.contains('research-date-input') || input.dataset.dateFormat === 'compact';
            return {
                locale: (window.flatpickr && window.flatpickr.l10ns && window.flatpickr.l10ns.ko) ? window.flatpickr.l10ns.ko : undefined,
                allowInput: isCompactDate,
                disableMobile: true,
                altInput: true,
                altInputClass: isDateTime
                    ? 'flatpickr-alt-input flatpickr-alt-input--datetime'
                    : 'flatpickr-alt-input flatpickr-alt-input--date',
                dateFormat: isCompactDate ? 'Ymd' : isDateTime ? 'Y-m-d\\TH:i' : 'Y-m-d',
                altFormat: isDateTime ? 'Y.m.d H:i' : 'Y.m.d',
                enableTime: isDateTime,
                noCalendar: false,
                time_24hr: true,
                minuteIncrement: 5
            };
        }

        function bindDateInputs(root) {
            if (typeof window.flatpickr !== 'function') {
                return;
            }
            root.querySelectorAll('input[type="date"], input[type="datetime-local"], input.research-date-input, input[data-date-format="compact"]').forEach(function (input) {
                if (input.dataset.flatpickrBound === 'true' || input.dataset.flatpickrIgnore === 'true') {
                    return;
                }
                input.dataset.flatpickrBound = 'true';
                window.flatpickr(input, createOptions(input));
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            bindDateInputs(document);
        });
    }());
</script>
</body>
</html>
