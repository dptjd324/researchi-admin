<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{layout/base :: shell(${pageTitle}, ~{::content})}">
    <th:block th:fragment="content">
        <section class="auth-shell login-shell">
            <div class="login-console">
                <div class="login-console-top">
                    <div class="login-brand">
                        <div>
                            <p class="login-eyebrow">운영 관리 콘솔</p>
                            <h1>RESEARCHI ADMIN</h1>
                        </div>
                    </div>
                </div>
                <div class="login-console-signal" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

            <div class="auth-panel login-panel">
                <div class="login-card">
                    <div class="auth-heading login-heading">
                        <h2>관리자 로그인</h2>
                    </div>

                    <div th:if="${loginErrorCode != null}" class="notice error">
                        <span th:if="${loginErrorCode == 'locked'}">계정이 잠겨 있습니다. 잠금 시간 종료 후 다시 시도해 주세요.</span>
                        <span th:if="${loginErrorCode != 'locked'}">로그인 ID 또는 비밀번호를 확인해 주세요.</span>
                    </div>
                    <div th:if="${param.logout}" class="notice success">로그아웃되었습니다.</div>
                    <div th:if="${param.passwordChanged}" class="notice success">비밀번호가 변경되었습니다. 다시 로그인해 주세요.</div>
                    <div th:if="${param.expired}" class="notice error">세션이 만료되었습니다. 다시 로그인해 주세요.</div>

                    <form action="/login" method="post" class="auth-form login-form" th:object="${loginForm}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <label>
                            <span>로그인 ID</span>
                            <input type="text" th:field="*{username}" autocomplete="username" placeholder="관리자 ID" required autofocus>
                        </label>
                        <label>
                            <span>비밀번호</span>
                            <input type="password" th:field="*{password}" autocomplete="current-password" placeholder="비밀번호" required>
                        </label>
                        <button type="submit">로그인</button>
                    </form>
                </div>
            </div>
        </section>
    </th:block>
</th:block>
</html>
