<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{layout/base :: shell(${pageTitle}, ~{::content})}">
    <th:block th:fragment="content">
        <section class="panel">
            <div class="dashboard-head dashboard-head--row">
                <div class="dashboard-head__copy">
                    <p class="eyebrow">관리자 전용</p>
                    <h2 class="h3 mb-2" th:text="${adminName + ' 대시보드'}">관리자 대시보드</h2>
                    <p class="dashboard-copy mb-0">기간 검색, 로그 확인, 운영 화면 이동을 한 곳에서 처리할 수 있습니다.</p>
                </div>
                <div class="dashboard-actions dashboard-actions--row">
                    <a th:href="@{/jobs}" class="secondary-link">공고</a>
                    <a th:href="@{/applications}" class="secondary-link">지원서</a>
                    <a th:href="@{/search}" class="secondary-link">기간 검색</a>
                    <a th:href="@{/logs/actions}" class="secondary-link">로그</a>
                    <a th:href="@{/account/password}" class="secondary-link">비밀번호 변경</a>
                    <form action="/logout" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit">로그아웃</button>
                    </form>
                </div>
            </div>

            <div class="grid">
                <article class="metric">
                    <strong>로그인 ID</strong>
                    <span th:text="${loginId}">admin</span>
                </article>
                <article class="metric">
                    <strong>세션 만료 시간</strong>
                    <span th:text="${sessionTimeout}">30분</span>
                </article>
                <article class="metric">
                    <strong>로그인 실패 허용 횟수</strong>
                    <span th:text="${loginFailLimit + '회'}">5회</span>
                </article>
                <article class="metric">
                    <strong>잠금 시간</strong>
                    <span th:text="${lockMinutes + '분'}">15분</span>
                </article>
            </div>

            <div class="note">
                기간 검색, 액션 로그, 메일 로그, 검색 로그, 알림 로그를 하단 상태 바와 운영 화면에서 함께 확인할 수 있습니다.
            </div>
        </section>
    </th:block>
</th:block>
</html>
