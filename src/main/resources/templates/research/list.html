<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{layout/base :: shell(${pageTitle}, ~{::content})}">
    <th:block th:fragment="content">
        <section class="panel research-list-page admin-data-page">
            <div class="dashboard-head research-list-head">
                <div>
                    <h2 class="h3 mb-2">좌담회/설문 조회</h2>
                </div>
                <div class="dashboard-actions">
                    <a th:if="${!hiddenMode}" th:href="@{/research/hidden}" class="secondary-link research-hidden-link">숨김 공고</a>
                    <a th:if="${hiddenMode}" th:href="@{/research}" class="secondary-link">전체 공고</a>
                    <a th:href="@{/research/new}" class="secondary-link">등록</a>
                </div>
            </div>

            <div th:if="${param.hidden}" class="notice success">공고를 숨김 처리했습니다.</div>
            <div th:if="${param.restored}" class="notice success">숨김을 해제했습니다.</div>

            <form method="get" th:action="${hiddenMode} ? @{/research/hidden} : @{/research}" class="research-list-search admin-data-search admin-data-search--research">
                <input type="hidden" name="sort" th:if="${sort != null}" th:value="${sort}" />
                <input type="hidden" name="direction" th:if="${sort != null}" th:value="${direction}" />
                <label class="research-date-range">
                    <span>등록일자</span>
                    <input type="text" name="registStart" th:value="${registStart}" placeholder="20240501" class="research-date-input" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" autocomplete="off" data-flatpickr-ignore="true" />
                    <strong>~</strong>
                    <input type="text" name="registEnd" th:value="${registEnd}" placeholder="20260504" class="research-date-input" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" autocomplete="off" data-flatpickr-ignore="true" />
                </label>
                <label>
                    <span>설문제목</span>
                    <input type="text" name="title" th:value="${(title == '좌담회/설문' or title == '좌담회' or title == '설문') ? '' : title}" autocomplete="off" />
                </label>
                <label>
                    <span>회사명</span>
                    <input type="text" name="companyName" th:value="${companyName}" />
                </label>
                <label>
                    <span>담당자명</span>
                    <input type="text" name="serverName" th:value="${serverName}" />
                </label>
                <label>
                    <span>통합 검색</span>
                    <input type="text" name="keyword" th:value="${keyword}" placeholder="title, company, contact" />
                </label>
                <div class="research-list-search__actions">
                    <button type="submit">조회</button>
                    <a th:href="${hiddenMode} ? @{/research/hidden} : @{/research}" class="secondary-link">초기화</a>
                </div>
            </form>

            <div class="research-list-count admin-data-count">
                [ <strong th:text="${totalItemCount}">0</strong> 건 조회가 되었습니다. ]
            </div>

            <div class="table-responsive" th:if="${!#lists.isEmpty(researchMasters)}">
                <table class="table align-middle research-master-table admin-data-table">
                    <thead>
                    <tr>
                        <th>CODE</th>
                        <th>좌담회/설문 제목</th>
                        <th>회사명</th>
                        <th>담당자명</th>
                        <th>연락처</th>
                        <th>소개비</th>
                        <th>정산</th>
                        <th>기타</th>
                        <th>
                            <a th:if="${nextCloseDateSort != null}" class="research-sort-link"
                               th:href="${hiddenMode}
                                   ? @{/research/hidden(keyword=${keyword},registStart=${registStart},registEnd=${registEnd},title=${title},companyName=${companyName},serverName=${serverName},sort=${nextCloseDateSort},direction=${nextCloseDateSortDirection})}
                                   : @{/research(keyword=${keyword},registStart=${registStart},registEnd=${registEnd},title=${title},companyName=${companyName},serverName=${serverName},sort=${nextCloseDateSort},direction=${nextCloseDateSortDirection})}">
                                마감일자
                                <span th:if="${sort == 'closeDate'}" th:text="${direction == 'asc' ? '▲' : '▼'}">▼</span>
                            </a>
                            <a th:if="${nextCloseDateSort == null}" class="research-sort-link"
                               th:href="${hiddenMode}
                                   ? @{/research/hidden(keyword=${keyword},registStart=${registStart},registEnd=${registEnd},title=${title},companyName=${companyName},serverName=${serverName})}
                                   : @{/research(keyword=${keyword},registStart=${registStart},registEnd=${registEnd},title=${title},companyName=${companyName},serverName=${serverName})}">
                                마감일자
                                <span th:if="${sort == 'closeDate'}" th:text="${direction == 'asc' ? '▲' : '▼'}">▼</span>
                            </a>
                        </th>
                        <th>
                            <a th:if="${nextRegistDtSort != null}" class="research-sort-link"
                               th:href="${hiddenMode}
                                   ? @{/research/hidden(keyword=${keyword},registStart=${registStart},registEnd=${registEnd},title=${title},companyName=${companyName},serverName=${serverName},sort=${nextRegistDtSort},direction=${nextRegistDtSortDirection})}
                                   : @{/research(keyword=${keyword},registStart=${registStart},registEnd=${registEnd},title=${title},companyName=${companyName},serverName=${serverName},sort=${nextRegistDtSort},direction=${nextRegistDtSortDirection})}">
                                등록일자
                                <span th:if="${sort == 'registDt'}" th:text="${direction == 'asc' ? '▲' : '▼'}">▼</span>
                            </a>
                            <a th:if="${nextRegistDtSort == null}" class="research-sort-link"
                               th:href="${hiddenMode}
                                   ? @{/research/hidden(keyword=${keyword},registStart=${registStart},registEnd=${registEnd},title=${title},companyName=${companyName},serverName=${serverName})}
                                   : @{/research(keyword=${keyword},registStart=${registStart},registEnd=${registEnd},title=${title},companyName=${companyName},serverName=${serverName})}">
                                등록일자
                                <span th:if="${sort == 'registDt'}" th:text="${direction == 'asc' ? '▲' : '▼'}">▼</span>
                            </a>
                        </th>
                        <th>
                            <a th:if="${nextApplicantSort != null}" class="research-sort-link"
                               th:href="${hiddenMode}
                                   ? @{/research/hidden(keyword=${keyword},registStart=${registStart},registEnd=${registEnd},title=${title},companyName=${companyName},serverName=${serverName},sort=${nextApplicantSort},direction=${nextApplicantSortDirection})}
                                   : @{/research(keyword=${keyword},registStart=${registStart},registEnd=${registEnd},title=${title},companyName=${companyName},serverName=${serverName},sort=${nextApplicantSort},direction=${nextApplicantSortDirection})}">
                                신청자
                                <span th:if="${sort == 'appNewCnt'}" th:text="${direction == 'asc' ? '▲' : '▼'}">▼</span>
                            </a>
                            <a th:if="${nextApplicantSort == null}" class="research-sort-link"
                               th:href="${hiddenMode}
                                   ? @{/research/hidden(keyword=${keyword},registStart=${registStart},registEnd=${registEnd},title=${title},companyName=${companyName},serverName=${serverName})}
                                   : @{/research(keyword=${keyword},registStart=${registStart},registEnd=${registEnd},title=${title},companyName=${companyName},serverName=${serverName})}">
                                신청자
                                <span th:if="${sort == 'appNewCnt'}" th:text="${direction == 'asc' ? '▲' : '▼'}">▼</span>
                            </a>
                        </th>
                        <th>관리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="research : ${researchMasters}">
                        <td th:text="${research.researchNo}">46408</td>
                        <td>
                            <a th:href="@{/research/{researchNo}(researchNo=${research.researchNo})}"
                               th:text="${research.researchTitle}"
                               class="job-title-link">설문 제목</a>
                        </td>
                        <td th:text="${research.companyName ?: '-'}">회사명</td>
                        <td th:text="${research.serverName ?: '-'}">담당자명</td>
                        <td th:text="${research.contactNo ?: '-'}">연락처</td>
                        <td th:text="${research.brokerageAmt ?: '-'}">5,000</td>
                        <td th:text="${research.calculateYn ?: '-'}">N</td>
                        <td th:text="${research.remark ?: '-'}">기타</td>
                        <td th:text="${research.closeDateLabel}">2026-11-01</td>
                        <td th:text="${research.registDateLabel}">2025-11-07</td>
                        <td>
                            <a th:href="@{/research/{researchNo}/applications(researchNo=${research.researchNo})}" class="research-app-link">신청자조회</a>
                            <span th:text="${' (' + (research.appNewCnt != null ? research.appNewCnt : 0) + '/' + (research.appCnt != null ? research.appCnt : 0) + ')'}">(9/63)</span>
                        </td>
                        <td class="research-list-actions-cell">
                            <form th:if="${!hiddenMode}" th:action="@{/research/{researchNo}/hide(researchNo=${research.researchNo})}" method="post" class="inline-form">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="research-hide-button" onclick="return confirm('이 공고를 숨김 처리하시겠습니까? 신청자와 이력은 삭제되지 않습니다.');">숨김</button>
                            </form>
                            <form th:if="${hiddenMode}" th:action="@{/research/{researchNo}/restore(researchNo=${research.researchNo})}" method="post" class="inline-form">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="research-restore-button" onclick="return confirm('이 공고의 숨김을 해제하시겠습니까?');">숨김 해제</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${#lists.isEmpty(researchMasters)}" class="note">
                현재 조건에 맞는 좌담회/설문이 없습니다.
            </div>

            <div class="pagination-bar" th:if="${paginationEnabled}">
                <a th:if="${firstPageUrl != null}" th:href="${firstPageUrl}" class="pagination-bar__nav" aria-label="first page">처음</a>
                <span th:if="${firstPageUrl == null}" class="pagination-bar__nav pagination-bar__nav--disabled" aria-hidden="true">처음</span>
                <a th:if="${previousPageUrl != null}" th:href="${previousPageUrl}" class="pagination-bar__nav" aria-label="previous page">이전</a>
                <span th:if="${previousPageUrl == null}" class="pagination-bar__nav pagination-bar__nav--disabled" aria-hidden="true">이전</span>
                <a th:each="pageLink : ${pageLinks}"
                   th:href="${pageLink.url}"
                   th:text="${pageLink.pageNumber}"
                   th:classappend="${pageLink.current ? ' pagination-bar__page--active' : ''}"
                   class="pagination-bar__page">1</a>
                <a th:if="${nextPageUrl != null}" th:href="${nextPageUrl}" class="pagination-bar__nav" aria-label="next page">다음</a>
                <span th:if="${nextPageUrl == null}" class="pagination-bar__nav pagination-bar__nav--disabled" aria-hidden="true">다음</span>
                <a th:if="${lastPageUrl != null}" th:href="${lastPageUrl}" class="pagination-bar__nav" aria-label="last page">마지막</a>
                <span th:if="${lastPageUrl == null}" class="pagination-bar__nav pagination-bar__nav--disabled" aria-hidden="true">마지막</span>
            </div>
        </section>

        <style>
            .research-list-page {
                padding: 1.35rem;
                overflow-x: hidden;
            }

            .research-list-head {
                margin-bottom: 0.9rem;
            }

            .research-list-search {
                display: grid;
                grid-template-columns: minmax(260px, 1.15fr) minmax(170px, 1fr) minmax(150px, 0.85fr) minmax(150px, 0.85fr) minmax(180px, 1fr) auto;
                gap: 0.55rem;
                align-items: end;
                border-top: 2px solid #9fd1ec;
                border-bottom: 2px solid #9fd1ec;
                padding: 0.65rem 0;
                min-width: 0;
            }

            .research-list-search label {
                display: grid;
                gap: 0.25rem;
                margin: 0;
                min-width: 0;
            }

            .research-list-search span {
                color: #1490be;
                font-weight: 700;
            }

            .research-list-search input {
                min-height: 38px;
                border: 1px solid #c8d8ea;
                border-radius: 6px;
                background: #fff;
            }

            .research-date-range {
                grid-template-columns: auto 1fr auto 1fr;
                align-items: center;
            }

            .research-date-range span {
                grid-column: 1 / -1;
            }

            .research-date-range strong {
                color: #526477;
                font-weight: 500;
                text-align: center;
            }

            .research-list-search__actions {
                display: flex;
                gap: 0.35rem;
                align-items: center;
                justify-content: flex-end;
                white-space: nowrap;
                min-width: 0;
            }

            .research-list-search__actions button,
            .research-list-search__actions .secondary-link {
                min-height: 38px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }

            .research-list-count {
                margin: 0.55rem 0 0.35rem;
                color: #1f3345;
            }

            .research-list-count strong {
                color: #d23b4d;
            }

            .research-hidden-link,
            .research-hide-button {
                border-color: #f59e0b;
                color: #9a5800;
                background: #fff8ed;
            }

            .research-hide-button,
            .research-restore-button {
                min-height: 34px;
                padding: 0.35rem 0.75rem;
                border-radius: 8px;
                font-weight: 700;
                white-space: nowrap;
            }

            .research-restore-button {
                border: 1px solid #92c8be;
                color: #087666;
                background: #eefbf7;
            }

            .research-list-actions-cell {
                text-align: center;
                white-space: nowrap;
            }

            .research-master-table {
                font-size: 0.92rem;
            }

            .research-master-table th {
                color: #1490be;
                text-align: center;
                white-space: nowrap;
                border-top: 2px solid #9fd1ec;
                border-bottom: 1px solid #cfdfeb;
                background: #fbfdff;
            }

            .research-master-table td {
                border-bottom: 1px solid #d9e3ec;
                vertical-align: middle;
                padding-top: 0.55rem;
                padding-bottom: 0.55rem;
            }

            .research-master-table td:nth-child(1),
            .research-master-table td:nth-child(6),
            .research-master-table td:nth-child(7),
            .research-master-table td:nth-child(9),
            .research-master-table td:nth-child(10),
            .research-master-table td:nth-child(11),
            .research-master-table td:nth-child(12) {
                text-align: center;
                white-space: nowrap;
            }

            .research-master-table td:nth-child(2) {
                min-width: 420px;
                line-height: 1.45;
            }

            .research-master-table td:nth-child(8) {
                min-width: 220px;
                color: #526477;
            }

            .research-app-link {
                color: #172638;
                text-decoration: none;
            }

            .research-app-link:hover {
                text-decoration: underline;
            }

            .research-sort-link {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 0.25rem;
                color: #1490be;
                font-weight: 800;
                text-decoration: none;
            }

            .research-sort-link:hover,
            .research-sort-link:focus {
                color: #007b72;
                text-decoration: underline;
                text-underline-offset: 3px;
            }

            @media (max-width: 1200px) {
                .research-list-search {
                    grid-template-columns: 1fr 1fr;
                }
            }

            @media (max-width: 760px) {
                .research-list-search {
                    grid-template-columns: 1fr;
                }
            }
        </style>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                document.querySelectorAll('.research-date-input').forEach(function (input) {
                    input.addEventListener('input', function () {
                        input.value = input.value.replace(/\D/g, '').slice(0, 8);
                    });
                });
            });
        </script>
    </th:block>
</th:block>
</html>
