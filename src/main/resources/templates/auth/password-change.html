<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{layout/base :: shell(${pageTitle}, ~{::content})}">
    <th:block th:fragment="content">
        <section class="auth-shell">
            <div class="auth-panel">
                <div class="mb-4">
                    <p class="eyebrow">계정 관리</p>
                    <h2 class="h3 mb-2">비밀번호 변경</h2>
                    <p class="dashboard-copy mb-0">현재 비밀번호를 검증한 뒤 새 비밀번호로 변경합니다. 변경이 완료되면 현재 세션은 종료됩니다.</p>
                </div>

                <form action="/account/password" method="post" class="auth-form" th:object="${passwordChangeForm}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <label>
                        <span>현재 비밀번호</span>
                        <input type="password" th:field="*{currentPassword}" autocomplete="current-password" required>
                        <small th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}" class="field-error"></small>
                    </label>
                    <label>
                        <span>새 비밀번호</span>
                        <input type="password" th:field="*{newPassword}" autocomplete="new-password" required>
                        <small th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="field-error"></small>
                    </label>
                    <label>
                        <span>새 비밀번호 확인</span>
                        <input type="password" th:field="*{confirmPassword}" autocomplete="new-password" required>
                        <small th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="field-error"></small>
                    </label>
                    <div class="actions">
                        <button type="submit">비밀번호 변경</button>
                        <a th:href="@{/jobs}" class="secondary-link">공고로 돌아가기</a>
                    </div>
                </form>
            </div>
        </section>
    </th:block>
</th:block>
</html>
