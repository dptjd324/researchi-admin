<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{layout/base :: shell(${pageTitle}, ~{::content})}">
    <th:block th:fragment="content">
        <section class="panel">
            <div class="dashboard-head">
                <div>
                    <p class="eyebrow">Phase 7</p>
                    <h2 class="h3 mb-2">블랙리스트</h2>
                    <p class="dashboard-copy mb-0">차단 규칙을 관리하고 최근 매칭 로그와 관리자 액션 로그를 함께 확인합니다.</p>
                </div>
                <div class="dashboard-actions">
                    <a th:href="@{/applications}" class="secondary-link">지원서</a>
                    <a th:href="@{/jobs}" class="secondary-link">공고</a>
                </div>
            </div>

            <div th:if="${param.saved}" class="notice success">블랙리스트가 등록되었습니다.</div>
            <div th:if="${param.statusUpdated}" class="notice success">블랙리스트 상태가 변경되었습니다.</div>
            <div th:if="${#fields.hasGlobalErrors()}" class="notice error" th:each="error : ${#fields.globalErrors()}" th:text="${error}">검증 오류</div>

            <div class="form-layout">
                <div class="panel">
                    <h3 class="h5 mb-3" th:text="${form.id != null ? '항목 수정' : '새 항목 등록'}">새 항목 등록</h3>
                    <form th:action="@{/blacklist}" method="post" th:object="${form}" class="job-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" th:field="*{id}">

                        <div class="form-grid">
                            <label>
                                <span>이름</span>
                                <input type="text" th:field="*{blackName}" maxlength="100" placeholder="지원자 이름">
                                <div th:if="${#fields.hasErrors('blackName')}" class="field-error" th:errors="*{blackName}">이름 오류</div>
                            </label>
                            <label>
                                <span>휴대전화</span>
                                <input type="text" th:field="*{mobilePhone}" maxlength="30" placeholder="010-1234-5678">
                                <small class="field-help" th:text="${form.id != null ? '비우면 기존 저장 해시를 유지합니다.' : '전화번호는 해시로만 저장됩니다.'}">전화번호 안내</small>
                                <div th:if="${#fields.hasErrors('mobilePhone')}" class="field-error" th:errors="*{mobilePhone}">휴대전화 오류</div>
                            </label>
                            <label>
                                <span>생년월일</span>
                                <input type="date" th:field="*{blackBirthDate}">
                                <div th:if="${#fields.hasErrors('blackBirthDate')}" class="field-error" th:errors="*{blackBirthDate}">생년월일 오류</div>
                            </label>
                            <label>
                                <span>블랙리스트 모드</span>
                                <select th:field="*{blackMode}">
                                    <option value="">모드 선택</option>
                                    <option th:each="mode : ${modeOptions}"
                                            th:value="${mode}"
                                            th:text="${mode == 'PERMANENT_BLOCK' ? '영구 차단' : mode == 'TEMPORARY_BLOCK' ? '기간 차단' : mode == 'MANUAL_REVIEW' ? '관리자 검토' : mode}">영구 차단</option>
                                </select>
                                <div th:if="${#fields.hasErrors('blackMode')}" class="field-error" th:errors="*{blackMode}">모드 오류</div>
                            </label>
                            <label>
                                <span>만료 시각</span>
                                <input type="datetime-local" th:field="*{expiresAt}">
                                <small class="field-help">기간 차단일 때만 필요합니다.</small>
                                <div th:if="${#fields.hasErrors('expiresAt')}" class="field-error" th:errors="*{expiresAt}">만료 시각 오류</div>
                            </label>
                        </div>

                        <label>
                            <span>사유</span>
                            <textarea th:field="*{blackReason}" rows="4" maxlength="1000" placeholder="관리자 내부용 차단 사유"></textarea>
                            <div th:if="${#fields.hasErrors('blackReason')}" class="field-error" th:errors="*{blackReason}">사유 오류</div>
                        </label>

                        <div class="actions">
                            <button type="submit">항목 저장</button>
                            <a th:href="@{/blacklist}" class="secondary-link">입력 초기화</a>
                        </div>
                    </form>
                </div>

                <div class="panel">
                    <h3 class="h5 mb-3">필터</h3>
                    <form method="get" th:action="@{/blacklist}" class="job-form">
                        <label>
                            <span>검색어</span>
                            <input type="text" name="keyword" th:value="${keyword}" placeholder="ID, 이름, 사유 검색">
                        </label>
                        <div class="form-grid">
                            <label>
                                <span>활성 여부</span>
                                <select name="activeYn">
                                    <option value="">전체</option>
                                    <option th:each="option : ${activeOptions}"
                                            th:value="${option}"
                                            th:text="${option == 'Y' ? '활성' : option == 'N' ? '비활성' : option}"
                                            th:selected="${activeYn == option}">활성</option>
                                </select>
                            </label>
                            <label>
                                <span>모드</span>
                                <select name="blackMode">
                                    <option value="">전체</option>
                                    <option th:each="mode : ${modeOptions}"
                                            th:value="${mode}"
                                            th:text="${mode == 'PERMANENT_BLOCK' ? '영구 차단' : mode == 'TEMPORARY_BLOCK' ? '기간 차단' : mode == 'MANUAL_REVIEW' ? '관리자 검토' : mode}"
                                            th:selected="${blackMode == mode}">영구 차단</option>
                                </select>
                            </label>
                        </div>
                        <div class="actions">
                            <button type="submit">필터 적용</button>
                            <a th:href="@{/blacklist}" class="secondary-link">초기화</a>
                        </div>
                    </form>

                    <section class="compact-form">
                        <div class="dashboard-head dashboard-head--row blacklist-results-toolbar">
                            <h4 class="h6 mb-0">조회 결과</h4>
                            <div class="actions">
                                <form th:action="@{/blacklist/export/xlsx}" method="post" class="inline-export-form">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <input type="hidden" name="keyword" th:value="${keyword}">
                                    <input type="hidden" name="activeYn" th:value="${activeYn}">
                                    <input type="hidden" name="blackMode" th:value="${blackMode}">
                                    <button type="submit" class="secondary-link">XLSX 내려받기</button>
                                </form>
                                <form th:action="@{/blacklist/export/txt}" method="post" class="inline-export-form">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <input type="hidden" name="keyword" th:value="${keyword}">
                                    <input type="hidden" name="activeYn" th:value="${activeYn}">
                                    <input type="hidden" name="blackMode" th:value="${blackMode}">
                                    <button type="submit" class="secondary-link">TXT 내려받기</button>
                                </form>
                            </div>
                        </div>

                        <div class="blacklist-results-scroller"
                             th:classappend="${#lists.size(entries) > 10 ? ' blacklist-results-scroller--limited' : ''}">
                            <div class="job-list" th:if="${!#lists.isEmpty(entries)}">
                                <article class="job-item blacklist-result-item" th:each="entry : ${entries}">
                                    <div class="job-item-head">
                                        <div>
                                            <h5 class="h6 mb-1" th:text="${entry.blackName != null && !#strings.isEmpty(entry.blackName) ? entry.blackName : '이름 없음'}">이름 없음</h5>
                                            <p class="job-summary mb-0" th:text="${entry.blackReason != null && !#strings.isEmpty(entry.blackReason) ? entry.blackReason : '사유 없음'}">사유 없음</p>
                                        </div>
                                        <div class="actions">
                                            <a th:href="@{/blacklist(id=${entry.id}, keyword=${keyword}, activeYn=${activeYn}, blackMode=${blackMode})}" class="secondary-link">불러오기</a>
                                        </div>
                                    </div>
                                    <div class="job-meta-grid">
                                        <span><strong>ID</strong><span th:text="${entry.id}">1</span></span>
                                        <span><strong>활성 여부</strong><span th:text="${@uiLabels.yesNo(entry.activeYn)}">예</span></span>
                                        <span><strong>모드</strong><span th:text="${@uiLabels.blacklistMode(entry.blackMode)}">영구 차단</span></span>
                                        <span><strong>생년월일</strong><span th:text="${entry.blackBirthDate != null ? entry.blackBirthDate : '-'}">-</span></span>
                                        <span><strong>만료 시각</strong><span th:text="${@uiLabels.dateTime(entry.expiresAt)}">-</span></span>
                                        <span><strong>매칭 수</strong><span th:text="${entry.matchCount != null ? entry.matchCount : 0}">0</span></span>
                                    </div>
                                </article>
                            </div>
                            <div th:if="${#lists.isEmpty(entries)}" class="note">
                                조건에 맞는 블랙리스트가 없습니다.
                            </div>
                        </div>
                    </section>
                    <div class="pagination-bar" th:if="${paginationEnabled}">
                        <a th:if="${previousPageUrl != null}" th:href="${previousPageUrl}" class="pagination-bar__nav" aria-label="이전 페이지">‹</a>
                        <span th:if="${previousPageUrl == null}" class="pagination-bar__nav pagination-bar__nav--disabled" aria-hidden="true">‹</span>
                        <a th:each="pageLink : ${pageLinks}"
                           th:href="${pageLink.url}"
                           th:text="${pageLink.pageNumber}"
                           th:classappend="${pageLink.current ? ' pagination-bar__page--active' : ''}"
                           class="pagination-bar__page">1</a>
                        <a th:if="${nextPageUrl != null}" th:href="${nextPageUrl}" class="pagination-bar__nav" aria-label="다음 페이지">›</a>
                        <span th:if="${nextPageUrl == null}" class="pagination-bar__nav pagination-bar__nav--disabled" aria-hidden="true">›</span>
                    </div>
                </div>
            </div>
        </section>
    </th:block>
</th:block>
</html>
