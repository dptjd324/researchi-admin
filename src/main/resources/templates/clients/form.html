<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{layout/base :: shell(${pageTitle}, ~{::content})}">
    <th:block th:fragment="content">
        <section class="panel research-edit-page client-admin-page">
            <div class="dashboard-head">
                <div>
                    <h2 class="h3 mb-2" th:text="${clientForm.id != null ? '거래처 수정' : '거래처 등록'}">거래처 등록</h2>
                    <p class="summary mb-0">거래처 기본 정보와 발송 수신 이메일을 관리합니다.</p>
                </div>
                <div class="dashboard-actions">
                    <a th:href="@{/clients}" class="secondary-link">목록</a>
                    <a th:href="@{/research}" class="secondary-link">좌담회/설문</a>
                </div>
            </div>

            <div th:if="${param.saved}" class="notice success">거래처 정보를 저장했습니다.</div>

            <form th:action="@{/clients}" method="post" th:object="${clientForm}" class="research-edit-form client-edit-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" th:field="*{id}">
                <div th:if="${#fields.hasGlobalErrors()}" class="notice error" th:each="error : ${#fields.globalErrors()}" th:text="${error}">거래처 오류</div>

                <div class="research-edit-actions">
                    <button th:if="${clientForm.id != null}" type="submit" form="client-delete-form" class="danger-button">거래처 삭제</button>
                    <button type="submit">저장</button>
                    <a th:href="@{/clients}" class="secondary-link">목록</a>
                </div>

                <div class="research-edit-grid">
                    <label class="research-edit-grid__wide">
                        <span>거래처명</span>
                        <input type="text" th:field="*{clientName}" required>
                        <small th:if="${#fields.hasErrors('clientName')}" th:errors="*{clientName}" class="field-error"></small>
                    </label>
                    <label>
                        <span>부서</span>
                        <input type="text" th:field="*{departmentName}">
                    </label>
                    <label>
                        <span>대표 담당자명</span>
                        <input type="text" th:field="*{primaryContactName}">
                    </label>
                    <label>
                        <span>대표 이메일</span>
                        <input type="email" th:field="*{primaryEmail}" required>
                        <small th:if="${#fields.hasErrors('primaryEmail')}" th:errors="*{primaryEmail}" class="field-error"></small>
                    </label>
                    <label>
                        <span>담당자 연락처</span>
                        <input type="text" th:field="*{primaryContactNo}">
                    </label>
                    <label>
                        <span>사용 여부</span>
                        <select th:field="*{active}">
                            <option th:value="true">사용</option>
                            <option th:value="false">미사용</option>
                        </select>
                    </label>
                </div>
            </form>


            <form th:if="${clientForm.id != null}" id="client-delete-form" th:action="@{/clients/{clientId}/delete(clientId=${clientForm.id})}" method="post" class="client-delete-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            </form>
        </section>
    </th:block>
</th:block>
</html>
