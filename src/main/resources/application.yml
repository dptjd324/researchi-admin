spring:
  application:
    name: researchi-admin

  profiles:
    active: local

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true
    session:
      timeout: ${APP_SECURITY_SESSION_TIMEOUT:40m}

logging:
  level:
    root: info
    com.researchi.admin: debug
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: error

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  export:
    path: ./exports
  upload:
    path: ./uploads
  public-form:
    encryption-key: ${ENCRYPTION_KEY:dev-only-phase5-key-change-me}
    phone-hash-key: ${PHONE_HASH_KEY:dev-only-phase5-phone-hash-key-change-me}
    captcha-enabled: ${APP_PUBLIC_FORM_CAPTCHA_ENABLED:true}
    rate-limit-count: ${APP_PUBLIC_FORM_RATE_LIMIT_COUNT:5}
    rate-limit-window-seconds: ${APP_PUBLIC_FORM_RATE_LIMIT_WINDOW_SECONDS:300}
  mail:
    provider: ${APP_MAIL_PROVIDER:smtp}
    simulate-send: ${APP_MAIL_SIMULATE_SEND:true}
    from-address: ${APP_MAIL_FROM_ADDRESS:no-reply@researchi.local}
    from-name: ${APP_MAIL_FROM_NAME:Researchi}
    naver:
      base-url: ${APP_MAIL_NAVER_BASE_URL:https://mail.apigw.ntruss.com/api/v1}
      access-key: ${APP_MAIL_NAVER_ACCESS_KEY:}
      secret-key: ${APP_MAIL_NAVER_SECRET_KEY:}
      max-file-size-bytes: ${APP_MAIL_NAVER_MAX_FILE_SIZE_BYTES:10485760}
      max-total-attachment-size-bytes: ${APP_MAIL_NAVER_MAX_TOTAL_ATTACHMENT_SIZE_BYTES:20971520}
      max-body-size-bytes: ${APP_MAIL_NAVER_MAX_BODY_SIZE_BYTES:512000}
  keyword:
    min-length: ${APP_KEYWORD_MIN_LENGTH:2}
    max-length: ${APP_KEYWORD_MAX_LENGTH:40}
    max-keywords-per-source: ${APP_KEYWORD_MAX_PER_SOURCE:40}
  notification:
    base-url: ${APP_BASE_URL:http://localhost:8082}
    legacy-matching-sms-message: ${APP_NOTIFICATION_LEGACY_MATCHING_SMS_MESSAGE:}
    legacy-matching-email-subject: ${APP_NOTIFICATION_LEGACY_MATCHING_EMAIL_SUBJECT:}
    legacy-matching-email-body: ${APP_NOTIFICATION_LEGACY_MATCHING_EMAIL_BODY:}
    secondary-email-enabled: ${APP_NOTIFICATION_SECONDARY_EMAIL_ENABLED:false}
    secondary-email-subject: ${APP_NOTIFICATION_SECONDARY_EMAIL_SUBJECT:[Researchi] 추천 일감 다시 안내드립니다}
  sms:
    simulate-send: ${APP_SMS_SIMULATE_SEND:true}
    sender-id: ${APP_SMS_SENDER_ID:researchi}
    provider: ${APP_SMS_PROVIDER:naver-sens}
    access-key: ${APP_SMS_ACCESS_KEY:}
    secret-key: ${APP_SMS_SECRET_KEY:}
    service-id: ${APP_SMS_SERVICE_ID:}
    from-number: ${APP_SMS_FROM_NUMBER:}
    base-url: ${APP_SMS_BASE_URL:https://sens.apigw.ntruss.com}
    message-type: ${APP_SMS_MESSAGE_TYPE:LMS}
    daily-send-limit: ${APP_SMS_DAILY_SEND_LIMIT:500}
    monthly-send-limit: ${APP_SMS_MONTHLY_SEND_LIMIT:10000}
  scheduler:
    # 예약/임계치/정리 배치 활성화
    enabled: ${APP_SCHEDULER_ENABLED:true}
    scheduled-send-cron: ${APP_SCHEDULER_SCHEDULED_SEND_CRON:0 * * * * *}
    threshold-cron: ${APP_SCHEDULER_THRESHOLD_CRON:30 * * * * *}
    cleanup-cron: ${APP_SCHEDULER_CLEANUP_CRON:0 0 3 * * *}
    retention-months: ${APP_SCHEDULER_RETENTION_MONTHS:6}
  security:
    login-fail-limit: 5
    lock-minutes: 15
    session-timeout: 30m
