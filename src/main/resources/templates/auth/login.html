<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{layout/base :: shell(${pageTitle}, ~{::content})}">
    <th:block th:fragment="content">
        <section class="auth-shell">
            <div class="auth-panel">
                <div class="mb-4">
                    <p class="eyebrow">관리자 인증</p>
                    <h2 class="h3 mb-2">관리자 로그인</h2>
                    <p class="dashboard-copy mb-0">CSRF 보호, 세션 관리, 로그인 실패 제한, 잠금 정책이 적용된 관리자 로그인 화면입니다.</p>
                </div>

                <div th:if="${loginErrorCode != null}" class="notice error">
                    <span th:if="${loginErrorCode == 'locked'}">계정이 잠겨 있습니다. 잠금 시간 종료 후 다시 시도해 주세요.</span>
                    <span th:if="${loginErrorCode != 'locked'}">로그인 ID 또는 비밀번호를 확인해 주세요.</span>
                </div>
                <div th:if="${param.logout}" class="notice success">로그아웃되었습니다.</div>
                <div th:if="${param.passwordChanged}" class="notice success">비밀번호가 변경되어 다시 로그인해야 합니다.</div>
                <div th:if="${param.expired}" class="notice error">세션이 만료되어 다시 로그인해야 합니다.</div>

                <form action="/login" method="post" class="auth-form mt-4" th:object="${loginForm}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <label>
                        <span>로그인 ID</span>
                        <input type="text" th:field="*{username}" autocomplete="username" required>
                    </label>
                    <label>
                        <span>비밀번호</span>
                        <input type="password" th:field="*{password}" autocomplete="current-password" required>
                    </label>
                    <button type="submit">로그인</button>
                </form>
            </div>
        </section>
    </th:block>
</th:block>
</html>
