<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{layout/base :: shell(${pageTitle}, ~{::content})}">
    <th:block th:fragment="content">
        <section class="panel">
            <div class="dashboard-head">
                <div>
                    <h2 class="h3 mb-2">메일 템플릿</h2>
                    <p class="dashboard-copy mb-0">수동 발송, 예약 발송, 임계치 발송에 사용할 메일 제목과 본문 템플릿을 관리합니다.</p>
                </div>
                <div class="dashboard-actions">
                    <a th:href="@{/mail/send/history}" class="secondary-link">발송 이력</a>
                    <a th:href="@{/jobs}" class="secondary-link">공고</a>
                </div>
            </div>

            <div th:if="${param.saved}" class="notice success">메일 템플릿을 저장했습니다.</div>
            <div th:if="${#fields.hasGlobalErrors()}" class="notice error" th:each="error : ${#fields.globalErrors()}" th:text="${error}">템플릿 오류</div>

            <div class="form-layout">
                <div class="panel">
                    <h3 class="h5 mb-3" th:text="${templateForm.id != null ? '템플릿 수정' : '새 템플릿'}">새 템플릿</h3>
                    <form th:action="@{/mail/templates}" method="post" th:object="${templateForm}" class="job-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" th:field="*{id}">

                        <label>
                            <span>템플릿명</span>
                            <input type="text" th:field="*{templateName}" maxlength="120">
                            <div th:if="${#fields.hasErrors('templateName')}" class="field-error" th:errors="*{templateName}">템플릿 오류</div>
                        </label>

                        <label>
                            <span>메일 제목</span>
                            <input type="text" th:field="*{mailSubject}" maxlength="255" placeholder="{{jobTitle}} 공고 지원서 안내">
                            <div th:if="${#fields.hasErrors('mailSubject')}" class="field-error" th:errors="*{mailSubject}">제목 오류</div>
                        </label>

                        <label>
                            <span>메일 본문</span>
                            <textarea th:field="*{mailBody}" rows="12" placeholder="{{jobTitle}} 공고의 지원서 {{applicationCount}}건을 첨부해 드립니다."></textarea>
                            <div th:if="${#fields.hasErrors('mailBody')}" class="field-error" th:errors="*{mailBody}">본문 오류</div>
                        </label>

                        <div class="mail-variable-toolbar" data-mail-variable-toolbar>
                            <button type="button" data-mail-variable="{{jobTitle}}">공고명</button>
                            <button type="button" data-mail-variable="{{documentSrl}}">공고번호</button>
                            <button type="button" data-mail-variable="{{applicationCount}}">지원서 수</button>
                            <button type="button" data-mail-variable="{{attachmentType}}">첨부 형식</button>
                            <button type="button" data-mail-variable="{{triggerType}}">발송 유형</button>
                            <button type="button" data-mail-variable="{{sentAt}}">발송 시각</button>
                            <button type="button" data-mail-variable="{{applicantName}}">지원자명</button>
                            <button type="button" data-mail-variable="{{keywordSummary}}">키워드</button>
                            <button type="button" data-mail-variable="{{applyUrl}}">지원 URL</button>
                        </div>
                        <p class="helper">제목 또는 본문 입력란에 커서를 둔 뒤 필요한 항목을 누르면 치환값이 삽입됩니다.</p>

                        <label>
                            <span>사용 여부</span>
                            <select th:field="*{active}">
                                <option th:value="true">사용</option>
                                <option th:value="false">미사용</option>
                            </select>
                        </label>

                        <div class="actions">
                            <button type="submit">템플릿 저장</button>
                            <a th:href="@{/mail/templates}" class="secondary-link">입력 초기화</a>
                        </div>
                    </form>
                </div>

                <section class="panel">
                    <h3 class="h5 mb-3">템플릿 목록</h3>
                    <div class="job-list" th:if="${!#lists.isEmpty(templates)}">
                        <article class="job-item" th:each="template : ${templates}">
                            <div class="job-item-head">
                                <div>
                                    <p class="eyebrow" th:text="${template.activeYn == 'Y' ? '사용 중 템플릿' : '비활성 템플릿'}">사용 중</p>
                                    <h3 class="h5 mb-2" th:text="${template.templateName}">템플릿</h3>
                                    <p class="job-summary" th:text="${template.mailSubject}">제목</p>
                                </div>
                                <div class="actions">
                                    <a th:href="@{/mail/templates(templateId=${template.id})}" class="secondary-link">수정</a>
                                </div>
                            </div>
                            <div class="job-meta-grid">
                                <span><strong>상태</strong><span th:text="${template.activeYn == 'Y' ? '사용' : '미사용'}">사용</span></span>
                                <span><strong>수정 시각</strong><span th:text="${@uiLabels.dateTime(template.updatedAt)}">2026-04-16 - 12:00</span></span>
                            </div>
                            <div class="note" th:text="${#strings.abbreviate(template.mailBody, 300)}">본문 미리보기</div>
                        </article>
                    </div>
                    <div th:if="${#lists.isEmpty(templates)}" class="note">등록된 메일 템플릿이 없습니다.</div>
                </section>
            </div>

            <style>
                .mail-variable-toolbar {
                    display: flex;
                    flex-wrap: wrap;
                    gap: 0.4rem;
                }

                .mail-variable-toolbar button {
                    min-height: 2rem;
                    padding: 0 0.65rem;
                    border: 1px solid #cbd5e1;
                    border-radius: 0.45rem;
                    background: #f8fafc;
                    color: #334155;
                    font-size: 0.9rem;
                    font-weight: 700;
                    cursor: pointer;
                }

                .mail-variable-toolbar button:hover {
                    border-color: #94a3b8;
                    background: #f1f5f9;
                }
            </style>
            <script>
                document.querySelectorAll('[data-mail-variable-toolbar]').forEach((toolbar) => {
                    toolbar.addEventListener('click', (event) => {
                        const button = event.target.closest('[data-mail-variable]');
                        if (!button) {
                            return;
                        }
                        const form = button.closest('form');
                        const active = document.activeElement;
                        const editableInForm = active
                            && form
                            && form.contains(active)
                            && (active.matches('input[type="text"]') || active.matches('textarea'));
                        const target = editableInForm
                            ? active
                            : form.querySelector('input[name="mailSubject"], textarea[name="mailBody"]');
                        if (!target) {
                            return;
                        }
                        const token = button.dataset.mailVariable;
                        const start = target.selectionStart ?? target.value.length;
                        const end = target.selectionEnd ?? target.value.length;
                        target.value = target.value.slice(0, start) + token + target.value.slice(end);
                        const nextPosition = start + token.length;
                        target.focus();
                        target.setSelectionRange(nextPosition, nextPosition);
                    });
                });
            </script>
        </section>
    </th:block>
</th:block>
</html>
