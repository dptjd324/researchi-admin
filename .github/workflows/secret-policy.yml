name: Secret policy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tracked-file-policy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test policy behavior
        shell: powershell
        run: ./scripts/secrets/Test-SecretPolicy.Tests.ps1
      - name: Check tracked files
        shell: powershell
        run: ./scripts/secrets/Test-SecretPolicy.ps1 -RepositoryRoot .
