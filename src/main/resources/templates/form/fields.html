<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{layout/base :: shell(${pageTitle}, ~{::content})}">
    <th:block th:fragment="content">
        <section class="panel">
            <div class="dashboard-head">
                <div>
                    <h2 class="h3 mb-2">동적 질문 필드</h2>
                    <p class="dashboard-copy mb-0">
                        <strong th:text="${jobDetail.document.title}">공고명</strong>
                        <span th:text="${' (#' + documentSrl + ')'}">(#1)</span>
                    </p>
                </div>
                <div class="dashboard-actions">
                    <a th:href="@{/jobs/{documentSrl}/edit(documentSrl=${documentSrl})}" class="secondary-link">공고로 돌아가기</a>
                    <a th:href="@{/jobs/{documentSrl}/fields(documentSrl=${documentSrl})}" class="secondary-link">필드 화면</a>
                </div>
            </div>

            <div th:if="${param.saved}" class="notice success">필드를 저장했습니다.</div>
            <div th:if="${param.deleted}" class="notice success">필드를 삭제했습니다.</div>
            <div th:if="${#fields.hasGlobalErrors()}" class="notice error" th:each="error : ${#fields.globalErrors()}" th:text="${error}">검증 오류</div>

            <div class="form-layout">
                <div class="panel">
                    <h3 class="h5 mb-3">등록된 필드</h3>
                    <div class="job-list" th:if="${!#lists.isEmpty(fieldItems)}">
                        <article class="job-item" th:each="field : ${fieldItems}">
                            <div class="job-item-head">
                                <div>
                                    <h3 class="h6 mb-2" th:text="${field.fieldLabel}">필드 이름</h3>
                                    <p class="job-summary">
                                        <strong th:text="${field.fieldKey}">field_key</strong>
                                        <span th:text="${' | ' + (
                                            field.fieldType == 'TEXT' ? '한 줄 입력' :
                                            field.fieldType == 'TEXTAREA' ? '여러 줄 입력' :
                                            field.fieldType == 'NUMBER' ? '숫자' :
                                            field.fieldType == 'DATE' ? '날짜' :
                                            field.fieldType == 'SELECT' ? '선택 목록' :
                                            field.fieldType == 'RADIO' ? '단일 선택' :
                                            field.fieldType == 'CHECKBOX' ? '복수 선택' :
                                            field.fieldType
                                        ) + ' | 순서 ' + field.fieldOrder}">타입</span>
                                    </p>
                                </div>
                                <div class="dashboard-actions">
                                    <a th:href="@{/jobs/{documentSrl}/fields(documentSrl=${documentSrl}, editFieldId=${field.id})}" class="secondary-link">수정</a>
                                    <form th:action="@{/jobs/{documentSrl}/fields/{fieldId}/delete(documentSrl=${documentSrl}, fieldId=${field.id})}" method="post" class="inline-form">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button type="submit">삭제</button>
                                    </form>
                                </div>
                            </div>
                            <div class="job-meta-grid">
                                <span><strong>필수 여부</strong><span th:text="${field.required ? '필수' : '선택'}">선택</span></span>
                                <span><strong>활성 여부</strong><span th:text="${field.active ? '활성' : '비활성'}">활성</span></span>
                                <span><strong>플레이스홀더</strong><span th:text="${field.placeholderText ?: '-'}">-</span></span>
                                <span><strong>도움말</strong><span th:text="${field.helpText ?: '-'}">-</span></span>
                            </div>
                            <div class="note" th:if="${!#lists.isEmpty(field.options)}">
                                <strong>선택 옵션</strong>
                                <div th:each="option : ${field.options}" th:text="${option.value + ' | ' + option.label}">value | label</div>
                            </div>
                        </article>
                    </div>
                    <div th:if="${#lists.isEmpty(fieldItems)}" class="note">이 공고에는 아직 동적 필드가 없습니다.</div>
                </div>

                <div class="panel">
                    <h3 class="h5 mb-3" th:text="${fieldForm.id != null ? '필드 수정' : '필드 추가'}">필드 추가</h3>
                    <form th:action="${fieldForm.id != null ? '/jobs/' + documentSrl + '/fields/' + fieldForm.id : '/jobs/' + documentSrl + '/fields'}" method="post" th:object="${fieldForm}" class="job-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="form-grid">
                            <label>
                                <span>필드 키</span>
                                <input type="text" th:field="*{fieldKey}" placeholder="favorite_brand">
                                <small th:if="${#fields.hasErrors('fieldKey')}" th:errors="*{fieldKey}" class="field-error"></small>
                            </label>
                            <label>
                                <span>필드 이름</span>
                                <input type="text" th:field="*{fieldLabel}" placeholder="선호 브랜드">
                                <small th:if="${#fields.hasErrors('fieldLabel')}" th:errors="*{fieldLabel}" class="field-error"></small>
                            </label>
                        </div>

                        <div class="form-grid triple">
                            <label>
                                <span>필드 유형</span>
                                <select th:field="*{fieldType}">
                                    <option th:each="fieldType : ${fieldTypes}"
                                            th:value="${fieldType.name()}"
                                            th:text="${
                                                fieldType.name() == 'TEXT' ? '한 줄 입력' :
                                                fieldType.name() == 'TEXTAREA' ? '여러 줄 입력' :
                                                fieldType.name() == 'NUMBER' ? '숫자' :
                                                fieldType.name() == 'DATE' ? '날짜' :
                                                fieldType.name() == 'SELECT' ? '선택 목록' :
                                                fieldType.name() == 'RADIO' ? '단일 선택' :
                                                fieldType.name() == 'CHECKBOX' ? '복수 선택' :
                                                fieldType.name()
                                            }">한 줄 입력</option>
                                </select>
                                <small th:if="${#fields.hasErrors('fieldType')}" th:errors="*{fieldType}" class="field-error"></small>
                            </label>
                            <label>
                                <span>순서</span>
                                <input type="number" th:field="*{fieldOrder}" min="1" max="999">
                                <small th:if="${#fields.hasErrors('fieldOrder')}" th:errors="*{fieldOrder}" class="field-error"></small>
                            </label>
                            <label>
                                <span>필수 여부</span>
                                <select th:field="*{required}">
                                    <option th:value="false">선택</option>
                                    <option th:value="true">필수</option>
                                </select>
                            </label>
                        </div>

                        <div class="form-grid">
                            <label>
                                <span>플레이스홀더</span>
                                <input type="text" th:field="*{placeholderText}">
                                <small th:if="${#fields.hasErrors('placeholderText')}" th:errors="*{placeholderText}" class="field-error"></small>
                            </label>
                            <label>
                                <span>활성 여부</span>
                                <select th:field="*{active}">
                                    <option th:value="true">활성</option>
                                    <option th:value="false">비활성</option>
                                </select>
                            </label>
                        </div>

                        <label>
                            <span>도움말</span>
                            <textarea th:field="*{helpText}" rows="3"></textarea>
                            <small th:if="${#fields.hasErrors('helpText')}" th:errors="*{helpText}" class="field-error"></small>
                        </label>

                        <label>
                            <span>선택 옵션</span>
                            <textarea th:field="*{optionsText}" rows="6" placeholder="value|label&#10;value2|label2"></textarea>
                            <small class="dashboard-copy">단일 선택, 복수 선택, 선택 목록일 때 사용합니다. 한 줄에 하나씩 입력해 주세요.</small>
                            <small th:if="${#fields.hasErrors('optionsText')}" th:errors="*{optionsText}" class="field-error"></small>
                        </label>

                        <div class="actions">
                            <button type="submit" th:text="${fieldForm.id != null ? '필드 수정' : '필드 추가'}">필드 추가</button>
                            <a th:href="@{/jobs/{documentSrl}/fields(documentSrl=${documentSrl})}" class="secondary-link">초기화</a>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </th:block>
</th:block>
</html>
