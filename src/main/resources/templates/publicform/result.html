<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">신청 결과</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/public-ui.css}">
</head>
<body class="public-body public-body--result">
<main class="public-result-page">
    <section class="public-result-card">
        <div class="public-result-card__mark" th:text="${resultTitle == '지원 완료' ? '✓' : '!'}">✓</div>
        <h1 class="public-result-card__title" th:text="${resultTitle == '지원 완료' ? '지원이 완료되었습니다' : resultTitle}">지원이 완료되었습니다</h1>
        <p class="public-result-card__message" th:text="${resultMessage}">지원서가 정상적으로 제출되었습니다.</p>
        <p class="public-result-card__sub" th:if="${resultTitle == '지원 완료'}">담당자가 내용을 확인한 뒤 필요한 경우 연락드리겠습니다.</p>
    </section>
</main>
</body>
</html>
