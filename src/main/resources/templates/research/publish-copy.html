<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{layout/base :: shell(${pageTitle}, ~{::content})}">
    <th:block th:fragment="content">
        <section class="panel research-publish-page admin-data-page">
            <div class="dashboard-head">
                <div>
                    <h2 class="h3 mb-2">홈페이지 게시문</h2>
                    <p class="dashboard-copy mb-0" th:text="${'CODE ' + research.researchNo + ' | ' + research.researchTitle}">CODE 46408</p>
                </div>
                <div class="dashboard-actions">
                    <a th:href="@{/research/{researchNo}(researchNo=${research.researchNo})}" class="secondary-link">좌담회/설문 상세</a>
                    <a th:href="@{/research/{researchNo}/applications(researchNo=${research.researchNo})}" class="secondary-link">지원자</a>
                    <a th:href="@{/research}" class="secondary-link">목록</a>
                </div>
            </div>

            <div th:if="${param.published}" class="notice success">수동 게시 기록을 저장했습니다.</div>

            <div class="research-meta-grid">
                <div><strong>CODE</strong><span th:text="${research.researchNo}">46408</span></div>
                <div><strong>신청자</strong><span th:text="${(research.appNewCnt != null ? research.appNewCnt : 0) + '/' + (research.appCnt != null ? research.appCnt : 0)}">9/63</span></div>
                <div><strong>등록일자</strong><span th:text="${research.registDateLabel}">2025-11-07</span></div>
                <div><strong>마감일자</strong><span th:text="${research.closeDateLabel}">2026-11-01</span></div>
            </div>

            <div class="publish-copy-grid">
                <section class="publish-copy-block">
                    <div class="publish-copy-block__head">
                        <h3>제목</h3>
                        <button type="button" class="secondary-link" data-copy-target="publish-title">복사</button>
                    </div>
                    <input id="publish-title" type="text" readonly="readonly" th:value="${publishContent.title}" />
                </section>

                <section class="publish-copy-block">
                    <div class="publish-copy-block__head">
                        <h3>본문</h3>
                        <button type="button" class="secondary-link" data-copy-target="publish-body">복사</button>
                    </div>
                    <textarea id="publish-body" rows="18" readonly="readonly" th:text="${publishContent.body}">body</textarea>
                </section>

                <section class="publish-copy-block">
                    <div class="publish-copy-block__head">
                        <div>
                            <h3>본문 링크 포함</h3>
                            <p>URL과 [문구](URL) 형식이 활성 링크로 유지됩니다.</p>
                        </div>
                        <button type="button" class="secondary-link" data-copy-html-target="publish-body-html">복사</button>
                    </div>
                    <div id="publish-body-html" class="publish-copy-html" contenteditable="true" th:utext="${publishContent.bodyHtml}">body</div>
                </section>
            </div>

            <form th:action="@{/research/{researchNo}/manual-publish-log(researchNo=${research.researchNo})}" method="post" class="manual-publish-log-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <label>
                    <span>홈페이지 게시글 번호</span>
                    <input type="number" name="publicDocumentSrl" placeholder="수동 게시 후 필요할 때만 입력" />
                </label>
                <button type="submit">수동 게시 기록</button>
            </form>

            <div class="manual-publish-latest" th:if="${latestPublishLog != null}">
                <strong>최근 기록</strong>
                <span th:text="${latestPublishLog.publishStatus}">MANUAL_PUBLISHED</span>
                <span th:if="${latestPublishLog.publicDocumentSrl != null}" th:text="${'게시글 번호 ' + latestPublishLog.publicDocumentSrl}">게시글 번호 123</span>
                <span th:if="${latestPublishLog.publicDocumentSrl == null}">게시글 번호 없음</span>
                <span th:text="${latestPublishLog.publishedAt != null ? latestPublishLog.publishedAt : latestPublishLog.createdAt}">2026-05-09</span>
            </div>
        </section>

        <style>
            .research-publish-page {
                padding: 1.35rem;
            }

            .publish-copy-grid {
                display: grid;
                gap: 1rem;
                margin-top: 1rem;
            }

            .publish-copy-block {
                border: 1px solid #d3e0ee;
                border-radius: 8px;
                padding: 1rem;
                background: #fff;
            }

            .publish-copy-block__head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 0.75rem;
                margin-bottom: 0.65rem;
            }

            .publish-copy-block__head h3 {
                margin: 0;
                font-size: 1rem;
                font-weight: 700;
            }

            .publish-copy-block__head p {
                margin: 0.25rem 0 0;
                color: #64758a;
                font-size: 0.86rem;
            }

            .publish-copy-block input,
            .publish-copy-block textarea {
                width: 100%;
                border: 1px solid #c8d8ea;
                border-radius: 8px;
                background: #f8fbff;
                color: #10233a;
            }

            .publish-copy-html {
                min-height: 12rem;
                width: 100%;
                border: 1px solid #c8d8ea;
                border-radius: 8px;
                background: #fff;
                color: #10233a;
                line-height: 1.65;
                padding: 0.75rem;
                word-break: break-word;
            }

            .publish-copy-html a {
                color: #007b72;
                font-weight: 700;
                text-decoration: underline;
                text-underline-offset: 3px;
            }

            .manual-publish-log-form {
                display: grid;
                grid-template-columns: minmax(240px, 1fr) auto;
                gap: 0.65rem;
                align-items: end;
                margin-top: 1rem;
                padding-top: 1rem;
                border-top: 1px solid #dce7f2;
            }

            .manual-publish-log-form label {
                display: grid;
                gap: 0.3rem;
                margin: 0;
            }

            .manual-publish-log-form span {
                color: #1490be;
                font-weight: 700;
            }

            .manual-publish-latest {
                display: flex;
                gap: 0.65rem;
                flex-wrap: wrap;
                margin-top: 0.8rem;
                color: #526477;
                font-size: 0.92rem;
            }

            @media (max-width: 760px) {
                .manual-publish-log-form {
                    grid-template-columns: 1fr;
                }
            }
        </style>
        <script>
            document.addEventListener('click', function (event) {
                const button = event.target.closest('[data-copy-target]');
                if (!button) {
                    return;
                }
                const target = document.getElementById(button.getAttribute('data-copy-target'));
                if (!target) {
                    return;
                }
                target.select();
                document.execCommand('copy');
                button.textContent = '복사됨';
                window.setTimeout(function () {
                    button.textContent = '복사';
                }, 1200);
            });

            document.addEventListener('click', function (event) {
                const button = event.target.closest('[data-copy-html-target]');
                if (!button) {
                    return;
                }
                const target = document.getElementById(button.getAttribute('data-copy-html-target'));
                if (!target) {
                    return;
                }
                const html = target.innerHTML;
                const text = target.innerText;
                if (navigator.clipboard && window.ClipboardItem) {
                    navigator.clipboard.write([
                        new ClipboardItem({
                            'text/html': new Blob([html], {type: 'text/html'}),
                            'text/plain': new Blob([text], {type: 'text/plain'})
                        })
                    ]).then(function () {
                        markHtmlCopied(button);
                    }, function () {
                        fallbackCopyHtml(target, button);
                    });
                    return;
                }
                fallbackCopyHtml(target, button);
            });

            function fallbackCopyHtml(target, button) {
                const selection = window.getSelection();
                const range = document.createRange();
                range.selectNodeContents(target);
                selection.removeAllRanges();
                selection.addRange(range);
                document.execCommand('copy');
                selection.removeAllRanges();
                markHtmlCopied(button);
            }

            function markHtmlCopied(button) {
                button.textContent = '복사됨';
                window.setTimeout(function () {
                    button.textContent = '복사';
                }, 1200);
            }
        </script>
    </th:block>
</th:block>
</html>
